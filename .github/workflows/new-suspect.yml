# Opens an issue when somebody joins the league.
#
# Fired by a repository_dispatch from Supabase — see
# supabase/sql/ff_notify_new_suspect.sql, which posts here from a trigger on
# ff_profiles. Watching this repo is what turns the issue into an email.
#
# The payload carries the username and nothing else. Names and email addresses
# stay in the database: an issue is readable by anyone with access to the repo
# and lives forever, which is the wrong home for either.
name: New suspect booked

on:
  repository_dispatch:
    types: [new-suspect]

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open the case file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, never interpolated into the script body.
          # A username is chosen by whoever signs up, and ${{ }} inside a run
          # block is substituted before bash ever sees it — a crafted name would
          # execute here. The join form restricts the charset, but this workflow
          # should not depend on a rule enforced somewhere else.
          SUSPECT: ${{ github.event.client_payload.username }}
          SUSPECTS_URL: https://thegamebureau.com/ff/suspects/
        run: |
          TITLE="New suspect booked: ${SUSPECT}"
          BODY=$(printf '**%s** has been booked into the 2026 season.\n\nSee the board: %s\n' \
            "${SUSPECT}" "${SUSPECTS_URL}")
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --body "${BODY}" \
            --label "signup" || \
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --body "${BODY}"
