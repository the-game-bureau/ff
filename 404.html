<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Case Not Found - Law &amp; Order: Special Victory Unit</title>
<meta name="robots" content="noindex"/>

<!--
  EVERY DEAD URL UNDER /ff/ LANDS ON THE PRECINCT.

  GitHub Pages serves this file, with a 404 status, for any path under this
  project that does not exist - whatever the depth. There is no server-side
  redirect available on Pages, so the redirect is done here, in the head, before
  anything paints.

  WHY THIS EXISTS
  Pages get retired. suspects/ and dispatch/ were both real URLs that people
  bookmarked and that went out in links, and the Precinct now holds what both of
  them held. A default 404 tells somebody the site is broken; this hands them
  the thing they were looking for.

  THE QUERY STRING AND THE HASH COME WITH IT. That is not a nicety - it is the
  point. Supabase confirmation emails sent before the suspects page was removed
  still carry redirect_to=.../ff/suspects/index.html, and Supabase appends
  #access_token=... to it. Dropping the fragment here would turn every one of
  those into a silent failed sign-up. Same for the #welcome the QR code carries
  and the recovery tokens js/password-reset.js reads.

  Nothing here loads a stylesheet, a font or an image. This page is served at
  whatever path was asked for, so a relative asset path would resolve against a
  directory that may not exist - and a 404 page that cannot render is worse than
  a plain one. Everything below is inline and self-contained.
-->
<script>
(function () {
  // The site is published at thegamebureau.com/ff/. Local testing serves this
  // folder at the root instead, where there is no /ff/ segment to match - so
  // the root is derived rather than assumed, and the page works both places.
  // If the site is ever published somewhere else, this is the line to change.
  var SITE_ROOT = '/ff/';
  var here = window.location.pathname;
  var root = here.indexOf(SITE_ROOT) === 0 ? SITE_ROOT : '/';

  // Already home: nothing to do. Cannot happen while the Precinct exists, and
  // costs one comparison to make a redirect loop impossible if it ever stops.
  if (here === root || here === root + 'index.html') return;

  // replace, not assign: this URL is a dead end, and leaving it in the history
  // means Back lands on it and bounces straight forward again.
  window.location.replace(root + window.location.search + window.location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/ff/"/></noscript>

       redirect on a slow connection. Written to be worth reading either way. -->
