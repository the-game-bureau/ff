<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enter the Lineup - Law &amp; Order: Special Victory Unit</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../src/lawandorder.jpg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../src/lawandorder.jpg"/>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://lawandorder-svu.app/join/"/>
  <meta property="og:title" content="Enter the Lineup - Law &amp; Order: Special Victory Unit"/>
  <meta property="og:description" content="Enter the lineup for Special Victory Unit."/>
  <meta property="og:image" content="../src/lawandorder.jpg"/>

  <!-- Supabase -->
  <!-- Pinned: @2 floats, and a release that declares a global `var supabase`
       collides with our client and kills the whole script at parse time. -->
  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
  <script src="../js/supabase-config.js?v=20260909b"></script>

<link rel="stylesheet" href="../css/site.css?v=20260909b"/>
</head>

<body>
  <header class="header" role="banner">
    <div class="header-logo-text">
      <div class="law-text">LAW<span class="ampersand">&</span></div>
      <div class="order-text">ORDER</div>
    </div>
    <div class="svu-subtitle">Enter the Lineup</div>
    <div id="weekBadge" class="week-badge" aria-live="polite"></div>
    <h1>Law &amp; Order: Special Victory Unit</h1>
    <!-- Echoes the real SVU cold open ("...members of an elite squad known as
         the Special Victims Unit. These are their stories.") but rewritten for
         the parody, so it stays unquoted per the site convention. -->
    <p class="tagline">These vicious felonies are investigated by an elite squad.<br/>Join it. These are their stories.</p>
  </header>

  <div id="siteNav" data-current="join" data-prefix="../"></div>

  <div class="container">
    <section class="game-info join-panel" aria-labelledby="joinTitle">
      <h2 id="joinTitle">Person of Interest</h2>

      <!-- The form is mounted here by js/join-form.js, which is also what the
           popup on every other page is built from. Two hand-maintained copies
           of it drifted apart within a day. -->
      <div id="joinFormMount"></div>
    </section>
  </div>

  <footer class="footer" role="contentinfo">
    <p class="credit-role">Executive Producer</p>
    <p class="credit-name">Kevin Kolb</p>
  </footer>

  <script src="../js/nfl-schedule.js?v=20260909b"></script>
  <script src="../js/season.js?v=20260909b"></script>
  <script src="../js/nav.js?v=20260909b"></script>
  <script src="../js/toast.js?v=20260909b"></script>
  <script src="../js/auth-corner.js?v=20260909b"></script>
  <script src="../js/mugshot-lightbox.js?v=20260909b"></script>
  <script src="../js/join-form.js?v=20260909b"></script>
  <script src="../js/join.js?v=20260909b"></script>
  <script src="../js/username-gate.js?v=20260909b"></script>
  <script src="../js/password-reset.js?v=20260909b"></script>
  <script src="../js/join-prefill.js?v=20260909b"></script>
  <script src="../js/welcome.js?v=20260909b"></script>
</body>
</html>
