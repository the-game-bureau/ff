<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Current Suspects &mdash; Law &amp; Order: Special Victory Unit</title>

  <link rel="icon" type="image/x-icon" href="../src/lawandorder.jpg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../src/lawandorder.jpg"/>

  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://lawandorder-svu.app/suspects/"/>
  <meta property="og:title" content="Current Suspects &mdash; Law &amp; Order: Special Victory Unit"/>
  <meta property="og:description" content="The current Special Victory Unit lineup."/>
  <meta property="og:image" content="../src/lawandorder.jpg"/>

  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>

  <link rel="stylesheet" href="../css/site.css"/>
</head>

<body>
  <header class="header" role="banner">
    <div class="header-logo-text">
      <div class="law-text">LAW<span class="ampersand">&</span></div>
      <div class="order-text">ORDER</div>
    </div>
    <div class="svu-subtitle">Current Suspects</div>
    <div id="weekBadge" class="week-badge" aria-live="polite"></div>
    <h1>Law &amp; Order: Special Victory Unit</h1>
    <p class="tagline">"Step forward. Face the glass. Try not to blink."</p>
  </header>

  <div id="siteNav" data-current="suspects" data-prefix="../"></div>

  <div class="container">
    <section class="lineup-section" aria-labelledby="currentSuspectsTitle">
      <!-- The count is folded in by suspects.js once the lineup loads; this is
           the pre-load placeholder, so it carries no number to be wrong. -->
      <h2 id="currentSuspectsTitle" class="section-heading">Current Suspects</h2>
      <div id="suspectsStatus" class="suspects-status" role="status" aria-live="polite"></div>

      <div class="lineup-room" aria-label="Police lineup room">
        <div class="lineup-measure" aria-hidden="true">
          <span>7 FT</span>
          <span>6 FT</span>
          <span>5 FT</span>
          <span>4 FT</span>
        </div>
        <ul id="suspectGrid" class="suspect-grid" aria-label="Current suspects"></ul>
      </div>
    </section>
  </div>

  <footer class="footer" role="contentinfo">
    <p class="credit-role">Executive Producer</p>
    <p class="credit-name">Dick Wolf</p>
  </footer>

  <script src="../js/nfl-schedule.js"></script>
  <script src="../js/season.js"></script>
  <script src="../js/teams.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/auth-corner.js"></script>
  <script src="../js/mugshot-lightbox.js"></script>
  <script src="../js/suspects.js"></script>
  <script src="../js/password-reset.js"></script>
</body>
</html>
