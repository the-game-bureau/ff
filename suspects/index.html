<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suspects &mdash; Law &amp; Order: Special Victory Unit</title>

  <link rel="icon" type="image/x-icon" href="../src/lawandorder.jpg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../src/lawandorder.jpg"/>

  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://lawandorder-svu.app/suspects/"/>
  <meta property="og:title" content="Suspects &mdash; Law &amp; Order: Special Victory Unit"/>
  <meta property="og:description" content="The current Special Victory Unit lineup."/>
  <meta property="og:image" content="../src/lawandorder.jpg"/>

  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
  <script src="../js/supabase-config.js"></script>

  <link rel="stylesheet" href="../css/site.css"/>
</head>

<body>
  <header class="header" role="banner">
    <div class="header-logo-text">
      <div class="law-text">LAW<span class="ampersand">&</span></div>
      <div class="order-text">ORDER</div>
    </div>
    <div class="svu-subtitle">Suspects</div>
    <div id="weekBadge" class="week-badge" aria-live="polite"></div>
    <h1>Law &amp; Order: Special Victory Unit</h1>
    <!-- Counts the faces pinned to the board; js/suspects.js fills the number
         in once the roster loads. The fallback stands in until then. -->
    <p class="tagline" id="lineupCall">"Nobody comes off the board until the case closes."</p>
  </header>

  <div id="siteNav" data-current="suspects" data-prefix="../"></div>

  <div class="container">
    <section class="lineup-section" aria-labelledby="currentSuspectsTitle">
      <!-- The count is folded in by suspects.js once the lineup loads; this is
           the pre-load placeholder, so it carries no number to be wrong. -->
      <h2 id="currentSuspectsTitle" class="section-heading">Suspects</h2>
      <div id="suspectsStatus" class="suspects-status" role="status" aria-live="polite"></div>

      <!-- The board in the squad room: every suspect's photo pinned up while
           the case is open. Nobody comes down until it closes. -->
      <div class="corkboard" aria-label="Investigation board">
        <ul id="suspectGrid" class="suspect-grid" aria-label="Current suspects"></ul>
      </div>
    </section>
  </div>

  <footer class="footer" role="contentinfo">
    <p class="credit-role">Executive Producer</p>
    <p class="credit-name">Kevin Kolb</p>
  </footer>

  <script src="../js/nfl-schedule.js"></script>
  <script src="../js/season.js"></script>
  <script src="../js/teams.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/auth-corner.js"></script>
  <script src="../js/mugshot-lightbox.js"></script>
  <script src="../js/suspects.js"></script>
  <script src="../js/mugshot-edit.js"></script>
  <script src="../js/join-modal.js"></script>
  <script src="../js/join.js"></script>
  <script src="../js/password-reset.js"></script>
  <script src="../js/join-prefill.js"></script>
  <script src="../js/welcome.js"></script>
</body>
</html>
