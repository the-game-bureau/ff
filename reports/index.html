<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case File &mdash; Law &amp; Order: Special Victory Unit</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../src/lawandorder.jpg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../src/lawandorder.jpg"/>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://lawandorder-svu.app/reports/"/>
  <meta property="og:title" content="Case File &mdash; Law &amp; Order: Special Victory Unit"/>
  <meta property="og:description" content="Week by week, how many prosecutors are left standing."/>
  <meta property="og:image" content="../src/lawandorder.jpg"/>

  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
  <script src="../js/supabase-config.js"></script>

<link rel="stylesheet" href="../css/site.css"/>
</head>

<body>
  <header class="header" role="banner">
    <div class="header-logo-text">
      <div class="law-text">LAW<span class="ampersand">&</span></div>
      <div class="order-text">ORDER</div>
    </div>
    <div class="svu-subtitle">Case File</div>
    <div id="weekBadge" class="week-badge" aria-live="polite"></div>
    <h1>Law &amp; Order: Special Victory Unit</h1>
    <p class="tagline">"The numbers don't lie. People do."</p>
  </header>

  <div id="siteNav" data-current="report" data-prefix="../"></div>

  <div class="container">
    <!-- Who is left against who is out. js/docket.js fills both. -->
    <section class="game-info docket" id="docket" aria-labelledby="docketTitle">
      <h3 id="docketTitle" class="sr-only">League status totals</h3>

      <div class="scoreboard">
        <div class="scoreboard-cell" id="docketStanding">
          <span class="scoreboard-count" id="docketCount" aria-live="polite">&mdash;</span>
          <span class="scoreboard-label" id="docketLabel">Still Standing</span>
        </div>

        <div class="scoreboard-cell scoreboard-cell-out" id="docketEliminated">
          <span class="scoreboard-count" id="docketOutCount" aria-live="polite">&mdash;</span>
          <span class="scoreboard-label" id="docketOutLabel">Dun Dun</span>
        </div>
      </div>
    </section>

    <section class="pick-clipboard" id="pickClipboard" aria-labelledby="pickClipboardTitle">
      <div class="pick-clipboard-paper">
        <div class="pick-clipboard-pad-head">
          <span class="pick-clipboard-pad-brand">the Legal Pad</span>
          <div class="pick-clipboard-nav" aria-label="Choose week">
            <button id="prevPickClipboardWeek" class="pick-clipboard-btn" type="button" aria-label="Previous week">&#9664;</button>
            <label class="sr-only" for="pickClipboardWeek">Week</label>
            <select id="pickClipboardWeek" class="pick-clipboard-select"></select>
            <button id="nextPickClipboardWeek" class="pick-clipboard-btn" type="button" aria-label="Next week">&#9654;</button>
          </div>
        </div>

        <div class="pick-clipboard-head">
          <h2 id="pickClipboardTitle">
            Week <span id="pickClipboardWeekTitle">1</span> Picks
            <span class="pick-clipboard-count" id="pickClipboardCount" aria-live="polite">Loading picks...</span>
          </h2>
        </div>

        <div class="pick-clipboard-table-wrap">
          <table class="pick-clipboard-table">
            <caption class="sr-only">Picks filed for the selected week</caption>
            <thead>
              <tr>
                <th scope="col">Suspect</th>
                <th scope="col">Victim</th>
                <th scope="col">Filed</th>
                <th scope="col">Result</th>
              </tr>
            </thead>
            <tbody id="pickClipboardBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer" role="contentinfo">
    <p class="credit-role">Executive Producer</p>
    <p class="credit-name">Kevin Kolb</p>
  </footer>

  <script src="../js/nfl-schedule.js"></script>
  <script src="../js/season.js"></script>
  <script src="../js/teams.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/docket.js"></script>
  <script src="../js/pick-clipboard.js"></script>
  <script src="../js/auth-corner.js"></script>
  <script src="../js/join-modal.js"></script>
  <script src="../js/join.js"></script>
  <script src="../js/password-reset.js"></script>
  <script src="../js/join-prefill.js"></script>
  <script src="../js/welcome.js"></script>
</body>
</html>
