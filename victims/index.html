<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Victims - Law &amp; Order: Special Victory Unit</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../src/lawandorder.jpg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../src/lawandorder.jpg"/>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://thegamebureau.com/ff/victims/"/>
  <meta property="og:title" content="Victims - Law &amp; Order: Special Victory Unit"/>
  <meta property="og:description" content="All 32 victims. One of them goes down every week."/>
  <meta property="og:image" content="https://thegamebureau.com/ff/src/lawandorder.jpg"/>

  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>
  <script src="../js/supabase-config.js?v=20260912h"></script>

<link rel="stylesheet" href="../css/site.css?v=20260912h"/>
</head>

<body>
  <header class="header" role="banner">
    <div class="header-logo-text">
      <div class="law-text">LAW<span class="ampersand">&</span></div>
      <div class="order-text">ORDER</div>
    </div>
    <div class="svu-subtitle">Victims</div>
    <div id="weekBadge" class="week-badge" aria-live="polite"></div>
    <h1>Law &amp; Order: Special Victory Unit</h1>
    <!-- Original line, not dialogue. Unquoted on purpose: the home page reserves
         quotation marks for the real cold-open narration. Deliberately vague
         about who and when - the joke is that the victim is going about their
         week with no idea, and you are already looking at them. -->
    <p class="tagline">Somewhere out there,<br/>your next victim is lurking.</p>
  </header>

  <div id="siteNav" data-current="victims" data-prefix="../"></div>

  <div class="container">
    <section class="team-selection" aria-labelledby="victimGridTitle">
      <div class="section-head">
        <h2 id="victimGridTitle">The Victims</h2>
        <!-- Only on screen when this week has a victim that can still be taken
             back, so it never offers to clear nothing, and never offers to
             clear a pick whose game has already started. -->
        <button id="weekClear" class="week-clear" type="button" hidden>Clear Pick</button>

        <!-- A stepper, not a dropdown: the weeks are consecutive and the one you
             want is nearly always next to the one you are on, which is two
             clicks in a select and one here. Arrows are drawn from borders in
             the stylesheet because the display font carries no arrow glyphs. -->
        <div class="week-picker" role="group" aria-label="Choose a week">
          <button id="weekPrev" class="week-step" type="button" aria-label="Previous week"></button>
          <span class="week-picker-label">Week</span>
          <span class="week-picker-value" id="weekValue" aria-live="polite">1</span>
          <button id="weekNext" class="week-step" type="button" aria-label="Next week"></button>
        </div>
        <a id="weekScheduleLink" class="schedule-link" target="_blank" rel="noopener noreferrer">View Full NFL Schedule</a>
      </div>
      <p id="victimIntro">Pick a victim that you believe will lose in week
      <strong id="victimWeek">1</strong>.</p>

      <ul class="victim-grid" id="victimGrid" aria-label="All 32 teams"></ul>
    </section>
  </div>

  <footer class="footer" role="contentinfo">
    <p class="credit-role">Executive Producer</p>
    <p class="credit-name">Kevin Kolb</p>
  </footer>

  <script src="../js/nfl-schedule.js?v=20260912h"></script>
  <script src="../js/toast.js?v=20260912h"></script>
  <script src="../js/season.js?v=20260912h"></script>
  <script src="../js/teams.js?v=20260912h"></script>
  <script src="../js/nav.js?v=20260912h"></script>
  <script src="../js/auth-corner.js?v=20260912h"></script>
  <script src="../js/victims.js?v=20260912h"></script>
  <script src="../js/join-form.js?v=20260912h"></script>
  <script src="../js/join-modal.js?v=20260912h"></script>
  <script src="../js/join.js?v=20260912h"></script>
  <script src="../js/username-gate.js?v=20260912h"></script>
  <script src="../js/password-reset.js?v=20260912h"></script>
  <script src="../js/join-prefill.js?v=20260912h"></script>
  <script src="../js/welcome.js?v=20260912h"></script>
</body>
</html>
