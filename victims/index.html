<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Victims — Law &amp; Order: Special Victory Unit</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../src/lawandorder.jpg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../src/lawandorder.jpg"/>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://lawandorder-svu.app/victims/"/>
  <meta property="og:title" content="Victims — Law &amp; Order: Special Victory Unit"/>
  <meta property="og:description" content="All 32 victims. One of them goes down every week."/>
  <meta property="og:image" content="../src/lawandorder.jpg"/>

  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3"></script>

<link rel="stylesheet" href="../css/site.css"/>
</head>

<body>
  <header class="header" role="banner">
    <div class="header-logo-text">
      <div class="law-text">LAW<span class="ampersand">&</span></div>
      <div class="order-text">ORDER</div>
    </div>
    <div class="svu-subtitle">Victims</div>
    <div id="weekBadge" class="week-badge" aria-live="polite"></div>
    <h1>Law &amp; Order: Special Victory Unit</h1>
    <!-- Original line, not dialogue. Unquoted on purpose: the home page reserves
         quotation marks for the real cold-open narration. Deliberately vague
         about who and when — the joke is that the victim is going about their
         week with no idea, and you are already looking at them. -->
    <p class="tagline">Somewhere out there, your next victim is lurking.</p>
  </header>

  <div id="siteNav" data-current="victims" data-prefix="../"></div>

  <div class="container">
    <section class="team-selection" aria-labelledby="victimGridTitle">
      <div class="section-head">
        <h2 id="victimGridTitle">The Victims</h2>
        <label class="week-picker">
          <span class="week-picker-label">Week</span>
          <select id="weekSelect" class="week-picker-select" aria-label="Choose a week"></select>
        </label>
        <a id="weekScheduleLink" class="schedule-link" target="_blank" rel="noopener noreferrer">View Full NFL Schedule</a>
      </div>
      <p id="victimIntro">Pick a victim that you believe will lose in week
      <strong id="victimWeek">1</strong>.</p>

      <div id="victimPickStatus" class="join-status" role="status" aria-live="polite"></div>
      <ul class="victim-grid" id="victimGrid" aria-label="All 32 teams"></ul>
    </section>
  </div>

  <footer class="footer" role="contentinfo">
    <p class="credit-role">Executive Producer</p>
    <p class="credit-name">Kevin Kolb</p>
  </footer>

  <script src="../js/nfl-schedule.js"></script>
  <script src="../js/season.js"></script>
  <script src="../js/teams.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/auth-corner.js"></script>
  <script src="../js/victims.js"></script>
  <script src="../js/join-modal.js"></script>
  <script src="../js/join.js"></script>
  <script src="../js/password-reset.js"></script>
  <script src="../js/join-prefill.js"></script>
  <script src="../js/welcome.js"></script>
</body>
</html>
